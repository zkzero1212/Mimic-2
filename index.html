<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mimic 2 · Pixel Dungeon</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/main.css">

    <!-- Firebase Realtime Database SDK (No Auth Required) -->
    <script type="module" src="js/firebase.js"></script>

</head>
<body class="min-h-screen flex flex-col items-center py-6 px-4 relative">

    <div class="w-full max-w-screen-2xl">
        <!-- Header -->
        <header class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600 mb-1 drop-shadow-sm">
                미믹 로직: 등반 모드 <span id="game-version" class="inline-block align-middle ml-1 text-xs md:text-sm font-bold text-slate-400 tracking-normal">v0.06</span>
            </h1>
            <p class="text-slate-500 text-xs md:text-sm" aria-hidden="true"></p>
        </header>

        <!-- Status Message -->
        <div id="status-message" class="hidden" aria-hidden="true"></div>
        <!-- Generating Warning -->
        <div id="gen-warning" class="hidden" aria-hidden="true"></div>
        <!-- Main Layout -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-2 items-start w-full">
            
            <!-- Left Info Panel (Climbing Stats) -->
            <div id="left-info-panel" class="bg-white rounded-xl p-2 shadow-sm border border-slate-200 lg:col-span-1 flex flex-col gap-1.5 transition-colors duration-300 min-w-0 text-[10px]">
                <h3 class="text-[11px] font-bold text-slate-700 uppercase tracking-tight border-b border-slate-200 pb-1 flex flex-col items-center gap-1 text-center">
                    <span>현재 층 정보</span>
                    <span class="text-[9px] font-extrabold text-indigo-600 bg-indigo-100 px-1.5 py-0.5 rounded shadow-sm whitespace-nowrap">최고 <span id="ui-max-floor">1</span>F</span>
                </h3>
                
                <div class="flex flex-col items-center justify-center gap-1 bg-indigo-50 p-2 rounded-lg border border-indigo-100 shadow-inner w-full min-w-0">
                    <span class="font-bold text-indigo-700 text-xs leading-tight whitespace-nowrap">현재층</span>
                    <span id="ui-floor" class="font-extrabold text-indigo-900 text-2xl leading-none drop-shadow-sm whitespace-nowrap">1F</span>
                </div>

                <div class="grid grid-cols-1 gap-1 text-[10px]">
                    <div class="bg-slate-50 p-1.5 rounded flex flex-col items-center border border-slate-100">
                        <span class="text-slate-500 font-bold mb-0.5 text-[9px]">상자 수</span>
                        <span id="info-total-chests" class="font-extrabold text-slate-800 text-xs">4개</span>
                    </div>
                    <div class="bg-slate-50 p-1.5 rounded flex flex-col items-center border border-slate-100">
                        <span class="text-slate-500 font-bold mb-0.5 text-[9px]">미믹 수</span>
                        <span id="info-mimics" class="font-extrabold text-red-600 text-xs">1마리</span>
                    </div>
                    <div class="bg-slate-50 p-1.5 rounded flex flex-col items-center border border-slate-100">
                        <span class="text-slate-500 font-bold mb-0.5 tracking-tighter text-[9px]">잠자는 상자</span>
                        <span id="info-sleep" class="font-extrabold text-purple-600 text-xs">0개</span>
                    </div>
                    <div class="bg-slate-50 p-1.5 rounded flex flex-col items-center border border-slate-100">
                        <span class="text-slate-500 font-bold mb-0.5 text-[9px] tracking-tighter">이벤트 확률</span>
                        <span id="ui-event-chance" class="font-extrabold text-amber-600 text-xs">0%</span>
                    </div>
                </div>
                
                <div class="flex flex-col gap-2 text-[9px] text-slate-600 font-medium bg-slate-50 p-1.5 rounded border border-slate-100">
                    <div class="flex flex-col items-center gap-0.5">
                        <span>다음 휴식처:</span><span id="ui-next-rest" class="font-bold text-indigo-600 bg-indigo-100 px-1.5 py-0.5 rounded">4층 남음</span>
                    </div>
                    <div class="flex flex-col items-center gap-0.5">
                        <span>다음 보스:</span><span id="ui-next-boss" class="font-bold text-red-600 bg-red-100 px-1.5 py-0.5 rounded">3층 남음</span>
                    </div>
                </div>

                <div class="border-t border-slate-200 pt-2 mt-1">
                    <span class="text-[9px] font-bold text-slate-700 block mb-1 text-center">활성화된 영구 저주</span>
                    <div id="ui-perm-curses" class="flex flex-wrap gap-1"></div>
                </div>
                <div class="border-t border-slate-200 pt-2 mt-1">
                    <span class="text-[11px] font-bold text-slate-700 block mb-1">구간 저주</span>
                    <div class="flex flex-col gap-1 text-[8px] font-extrabold text-center">
                        <span class="rounded bg-emerald-100 text-emerald-800 px-1 py-1">영구 상자 +<span id="ui-segment-chest-bonus">0</span></span>
                        <span class="rounded bg-violet-100 text-violet-800 px-1 py-1">영구 미믹 +<span id="ui-segment-mimic-bonus">0</span></span>
                    </div>
                </div>
                
                

                <div id="ui-event-logs" class="flex flex-col gap-1 mt-1"></div>
            </div>

            <!-- Center Chests Grid Area -->
            <div class="lg:col-span-10 flex flex-col items-center min-w-0 w-full">
                <!-- 가로형 구성품 리스트 -->
                <div id="info-treasures-list" class="flex flex-wrap justify-center items-center gap-2 md:gap-4 mb-4 bg-white px-3 py-2.5 rounded-xl shadow-sm border border-slate-200 w-full min-h-[48px]">
                </div>
                
                <!-- v0.05: 발언-상자 연결선 색상 팔레트 -->
                <div id="link-color-picker" class="v2-link-color-picker" role="group" aria-label="연결선 색상 선택">
                    <span class="v2-link-color-title">연결선 색상</span>
                    <button type="button" class="v2-link-color-option is-active" data-link-color="gold" aria-label="금색 연결선" aria-pressed="true" style="--link-swatch:#ffe18a"><span class="v2-link-color-dot" aria-hidden="true"></span>금색</button>
                    <button type="button" class="v2-link-color-option" data-link-color="mint" aria-label="민트색 연결선" aria-pressed="false" style="--link-swatch:#5eead4"><span class="v2-link-color-dot" aria-hidden="true"></span>민트</button>
                    <button type="button" class="v2-link-color-option" data-link-color="violet" aria-label="보라색 연결선" aria-pressed="false" style="--link-swatch:#c4b5fd"><span class="v2-link-color-dot" aria-hidden="true"></span>보라</button>
                    <button type="button" class="v2-link-color-option" data-link-color="coral" aria-label="분홍색 연결선" aria-pressed="false" style="--link-swatch:#fb7185"><span class="v2-link-color-dot" aria-hidden="true"></span>분홍</button>
                    <span id="link-color-mode-hint" class="v2-link-color-hint" aria-live="polite">선 클릭: 삭제 · 색상 선택 후 선 클릭: 색 변경</span>
                </div>
                
                <!-- v0.06: 클릭으로 상자를 지정해 마킹·메모 편집 -->
                <div id="mark-tools" class="v2-mark-tools" role="group" aria-label="상자 마킹 및 메모 편집">
                    <span class="v2-mark-tool-heading">마킹·메모</span>
                    <span id="mark-target-label" class="v2-mark-target-label" aria-live="polite">상자 아래 표시를 선택하세요</span>
                    <span class="v2-mark-tool-group" aria-label="마킹">
                        <button type="button" data-mark-value="O" aria-label="진짜 상자 O 표시" aria-pressed="false" disabled>O</button>
                        <button type="button" data-mark-value="X" aria-label="미믹 X 표시" aria-pressed="false" disabled>X</button>
                        <button type="button" data-mark-value="?" aria-label="불확실 ? 표시" aria-pressed="false" disabled>?</button>
                    </span>
                    <span class="v2-mark-tool-heading">메모</span>
                    <span class="v2-mark-tool-group" aria-label="숫자 메모">
                        <button type="button" data-memo-value="1" aria-pressed="false" disabled>1</button>
                        <button type="button" data-memo-value="2" aria-pressed="false" disabled>2</button>
                        <button type="button" data-memo-value="3" aria-pressed="false" disabled>3</button>
                        <button type="button" data-memo-value="4" aria-pressed="false" disabled>4</button>
                        <button type="button" data-memo-value="5" aria-pressed="false" disabled>5</button>
                    </span>
                    <span class="v2-mark-hint">기존 단축키 Q/W/E · 1~5 유지</span>
                </div>

                <div id="chests-container" class="flex flex-col gap-4 items-center mx-auto mb-6 pt-5 w-full min-w-0 overflow-visible transition-all duration-300">
                    <!-- Chests rendered here -->
                </div>
            </div>

            <!-- 기존 키보드 단축키 로직 호환용 숨김 컨트롤 -->
            <div class="hidden" aria-hidden="true">
                <button id="btn-next-floor" type="button"></button>
                <button id="btn-restart" type="button"></button>
                <button id="btn-open-o" type="button"></button>
                <button id="btn-clear-marks" type="button"></button>
            </div>
        </div>
    </div>

    <!-- Debug Controls (separate from normal gameplay) -->
    <section id="debug-tools" class="debug-tools" aria-label="디버그 도구">
        <h3>DEBUG</h3>
        <button id="debug-clear-floor" type="button">이 층 즉시 클리어</button>
    </section>

    <!-- Rest Area Overlay -->
    <div id="rest-area-overlay" class="hidden fixed inset-0 bg-slate-900 bg-opacity-85 flex items-center justify-center z-50 transition-opacity">
        <div class="bg-white p-6 md:p-8 rounded-2xl w-11/12 max-w-md text-center shadow-2xl border-4 border-indigo-200">
            <h2 class="text-2xl md:text-3xl font-extrabold text-indigo-700 mb-2 drop-shadow-sm">🔥 휴식처 (Camp) 🔥</h2>
            <p class="text-sm font-bold text-slate-600 mb-6 bg-slate-100 py-2 rounded-lg">다음 층을 대비해 한 가지 이득을 선택하세요.</p>
            <div id="rest-options" class="flex flex-col gap-3"></div>
        </div>
    </div>

    <script src="js/game.js" defer></script>
</body>
</html>
